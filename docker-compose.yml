services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metrotech_erf}
      POSTGRES_USER: ${POSTGRES_USER:-metrotech_erf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-metrotech_erf} -d ${POSTGRES_DB:-metrotech_erf}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - erf_pdfs:/data/pdfs
      - ./signatures:/data/signatures:ro
      - ./secrets/gcp-service-account.json:/run/secrets/gcp-service-account.json:ro

volumes:
  postgres_data:
  erf_pdfs:
