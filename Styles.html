<style>
:root{--navy:#0b3768;--bg:#f5f7fb;--line:#dde5ef;--text:#172033;--muted:#667085;--green:#087443;--red:#b42318;--amber:#b54708}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,sans-serif}.shell{max-width:1220px;margin:auto;padding:26px 18px 50px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}h1{font-size:25px;color:var(--navy);margin:0}.sub{color:var(--muted);margin-top:3px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#fff3c4;color:#6e5800;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}.chip.pale{background:#eaf3f7;color:var(--navy)}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(20,42,76,.05);margin-bottom:18px}.title{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:14px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-head .title{margin:0}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.readonly{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:10px;min-height:40px}input,textarea{width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit}textarea{resize:vertical;min-height:88px}.builder{display:grid;grid-template-columns:1fr 1.7fr .95fr .95fr 1.2fr auto;gap:10px;align-items:end;margin-top:14px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--navy);color:#fff}.secondary{background:#edf3f8;color:var(--navy)}.danger{background:#fff0ef;color:var(--red)}.success{background:#087443;color:#fff}.hint{font-size:12px;color:var(--muted)}.mt{margin-top:8px}.table-wrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);background:#f8fafc}.money{text-align:right;white-space:nowrap}.total{display:flex;justify-content:flex-end;gap:18px;padding-top:14px;font-size:17px;font-weight:800}.actions{display:flex;justify-content:flex-end;margin-top:16px}.status{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}.PENDING_REVIEW,.PENDING_APPROVAL{background:#fffaeb;color:var(--amber)}.REVIEW_REJECTED,.APPROVAL_REJECTED{background:#fff1f0;color:var(--red)}.APPROVED{background:#ecfdf3;color:var(--green)}.alert{display:none;border-radius:10px;padding:12px 14px;margin-bottom:14px}.alert.show{display:block}.alert.error{background:#fff1f0;color:var(--red);border:1px solid #fecdca}.alert.ok{background:#ecfdf3;color:var(--green);border:1px solid #abefc6}.notice{background:#fffaeb;border:1px solid #fedf89;border-radius:9px;padding:12px;margin-top:14px}.queue-row{cursor:pointer}.queue-row:hover td{background:#fbfdff}.modal{display:none;position:fixed;inset:0;background:rgba(8,20,38,.6);z-index:20;padding:18px;overflow:auto}.modal.show{display:block}.modal-card{max-width:1380px;margin:auto;background:#fff;border-radius:16px;min-height:calc(100vh - 36px);overflow:hidden}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;color:var(--navy);font-size:20px}.meta{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}.split{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);height:60vh}.viewer{display:flex;flex-direction:column;background:#edf1f5}.viewer-head{padding:8px 12px;background:#fff;font-weight:800;color:var(--navy);border-bottom:1px solid var(--line)}iframe{width:100%;height:100%;border:0;background:#fff}.decision{display:flex;gap:10px;align-items:end;padding:18px 20px;border-top:1px solid var(--line)}.grow{flex:1}.history{padding:0 20px 20px}.hist{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #edf1f5}.hidden{display:none!important}
@media(max-width:1000px){.grid5{grid-template-columns:repeat(2,1fr)}.builder{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.meta{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.grid5,.builder,.meta{grid-template-columns:1fr}.split{grid-template-columns:1fr;height:auto}.viewer{height:48vh}.decision{align-items:stretch;flex-direction:column}.modal{padding:0}.modal-card{border-radius:0;min-height:100vh}}
</style>
