name: Web CI

on:
  push:
    branches: [web, production-erf]
  pull_request:
    branches: [web, production-erf]

jobs:
  syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: metrotech_erf
          POSTGRES_USER: metrotech_erf
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrotech_erf -d metrotech_erf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: metrotech_erf
      POSTGRES_USER: metrotech_erf
      POSTGRES_PASSWORD: testpass
      REVIEWER_NAME: Dimas Jenar
      APPROVER_NAME: Ervan Mardianto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/db.js
          node --check src/auth.js
          node --check src/documents.js
          node --check src/request-packet.js
          node --check src/mailer.js
          node --check src/settings.js
          node --check src/ecf-bank-directory.js
          node --check src/ecf-profile-preload.js
          node --check public/app.js
          node --check public/request-type.js
          node --check public/ecf-admin.js
          node --check public/ecf-profile.js
          node --check public/ems.js
          node --check scripts/workflow-smoke.js
          node --check scripts/ems-http-smoke.js
          node --check scripts/ems-ui-smoke.js
          node --check scripts/pdf-wrap-smoke.js
      - name: Test workflow state machine
        run: npm run test:workflow
      - name: Test production ERF to EMS upgrade and rollback
        run: node scripts/release/upgrade-smoke.js
      - name: Test EMS HTTP workflow
        run: npm run test:ems-http
      - name: Install browser for UI regression checks
        run: npx playwright install --with-deps chromium
      - name: Test role navigation and isolated form drafts
        run: npm run test:ui
      - name: Test PDF long descriptions
        run: node scripts/pdf-wrap-smoke.js

  production-cutover:
    # This one-time release targets a pinned old production baseline/image.
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/release-ems-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release script syntax
        run: |
          bash -n scripts/release/cutover.sh
          bash -n scripts/release/cutover-common.sh
          bash -n scripts/release/rollback.sh
          bash -n scripts/release/cutover-smoke.sh
          node --check scripts/release/cutover-check.js
      - name: Test Docker production cutover and rollback
        run: bash scripts/release/cutover-smoke.sh
