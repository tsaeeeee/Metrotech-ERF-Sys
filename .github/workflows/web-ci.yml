name: Web CI

on:
  push:
    branches: [web, production-erf]
  pull_request:
    branches: [web, production-erf, feature/assigned-multi-role, feature/request-progress-visibility, feature/executive-review-workflow, fix/user-management-workflow-ui]

jobs:
  syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: metrotech_erf
          POSTGRES_USER: metrotech_erf
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrotech_erf -d metrotech_erf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: metrotech_erf
      POSTGRES_USER: metrotech_erf
      POSTGRES_PASSWORD: testpass
      REVIEWER_NAME: Dimas Jenar
      APPROVER_NAME: Ervan Mardianto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/db.js
          node --check src/drafts.js
          node --check public/dashboard-drafts.js
          node --check scripts/drafts-http-smoke.js
          node --check src/auth.js
          node --check src/documents.js
          node --check src/request-packet.js
          node --check src/mailer.js
          node --check src/settings.js
          node --check src/workflow-policy.js
          node --check src/access.js
          node --check src/ecf-bank-directory.js
          node --check src/ecf-profile-preload.js
          node --check public/app.js
          node --check public/request-type.js
          node --check public/ecf-admin.js
          node --check public/ecf-profile.js
          node --check public/ems.js
          node --check public/executive-workflow.js
          node --check scripts/executive-workflow-smoke.js
          node --check scripts/release-executive/upgrade.js
          node --check scripts/workflow-smoke.js
          node --check scripts/ems-http-smoke.js
          node --check scripts/ems-ui-smoke.js
          node --check scripts/pdf-wrap-smoke.js
      - name: Test workflow state machine
        run: npm run test:workflow
      - name: Test production ERF to EMS upgrade and rollback
        run: node scripts/release/upgrade-smoke.js
      - name: Test assigned multi-role and single-approver policy
        run: node scripts/multi-role-smoke.js
      - name: Test executive bypass, shared review, manual takeover and notes
        run: node scripts/executive-workflow-smoke.js
      - name: Test EMS HTTP workflow
        run: npm run test:ems-http
      - name: Test persistent drafts, ownership, retry safety and dashboard drilldowns
        run: node scripts/drafts-http-smoke.js
      - name: Install browser for UI regression checks
        run: npx playwright install --with-deps chromium
      - name: Test role navigation, mobile approval and session startup
        run: npm run test:ui
        env:
          EMS_UI_SCREENSHOTS: artifacts/ui
      - name: Save UI regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ems-ui-screenshots
          path: artifacts/ui
          if-no-files-found: ignore
          retention-days: 7
      - name: Test PDF long descriptions
        run: node scripts/pdf-wrap-smoke.js

  production-cutover:
    # This one-time release targets a pinned old production baseline/image.
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/release-ems-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release script syntax
        run: |
          bash -n scripts/release/cutover.sh
          bash -n scripts/release/cutover-common.sh
          bash -n scripts/release/rollback.sh
          bash -n scripts/release/cutover-smoke.sh
          node --check scripts/release/cutover-check.js
      - name: Test Docker production cutover and rollback
        run: bash scripts/release/cutover-smoke.sh

  staging-clone:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/assigned-multi-role'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test isolated EMS clone and local mail capture
        run: bash scripts/staging/smoke.sh

  multirole-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/assigned-multi-role'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test current EMS rehearsal, cutover and guarded rollback
        run: bash scripts/release-multirole/cutover-smoke.sh

  executive-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/executive-review-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image-reference: [tag, id]
    env:
      EMS_CI_IMAGE_REFERENCE: ${{ matrix.image-reference }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check executive deployment scripts
        run: |
          bash -n scripts/release-executive/rehearse.sh
          bash -n scripts/release-executive/cutover.sh
          bash -n scripts/release-executive/cutover-common.sh
          bash -n scripts/release-executive/rollback.sh
          bash -n scripts/release-executive/cutover-smoke.sh
          node --check scripts/release-executive/cutover-check.js
      - name: Test executive rehearsal, cutover, rollback and data protection
        run: bash scripts/release-executive/cutover-smoke.sh
